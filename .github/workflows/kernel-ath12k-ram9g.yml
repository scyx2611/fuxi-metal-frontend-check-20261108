name: Build opt-in Fuxi ath12k 9 GiB kernel with negotiated scan dwell
on:
  workflow_dispatch:
  push:
    branches:
      - codex/adsp-battery
    paths:
      - .github/workflows/kernel-ath12k-ram9g.yml
permissions:
  contents: read
  actions: read
jobs:
  kernel:
    uses: ./.github/workflows/kernel-adsp-battery.yml
    with:
      ram_layout: 9g
      artifact_name: fuxi-kernel-ath12k-ram9g
      runner_label: macos-15-intel
      ath12k: true
