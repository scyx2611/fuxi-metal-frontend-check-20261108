name: Validate isolated 000 hardware preparation
on:
  workflow_dispatch:
  push:
    branches:
      - codex/adsp-battery
    paths:
      - patches/kernel-adsp-battery.patch
      - patches/hw000-preparation.patch
      - .github/workflows/hw000-preparation.yml
permissions:
  contents: read
jobs:
  wlan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned public source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/zgl97/ios-fuxi.git
          git -C source fetch --no-tags --depth=1 origin 979e2f08c704677bb75934ae96d4686ba9d1692b
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 979e2f08c704677bb75934ae96d4686ba9d1692b
          for patch in surface-stride bo-slots surfrow-mode2 perf-governor ib-profile perf-wide prof-live prof-inclusive swipe-pacing prof-inclusive-wait prof-edges taps-presets input-fixes taps-page2 ibprof-draws taps-page1 backlight-dsi adsp-battery; do
            git -C source apply --check "../harness/patches/kernel-$patch.patch"
            git -C source apply "../harness/patches/kernel-$patch.patch"
          done
          if test -s harness/patches/hw000-preparation.patch; then
            git -C source apply --check ../harness/patches/hw000-preparation.patch
            git -C source apply ../harness/patches/hw000-preparation.patch
          fi
      - name: Verify 64-bit production WLAN and RTC peers
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          python3 tools/sync-fuxi-wlan.py --check
          python3 tools/sync-fuxi-h1.py --check
          python3 tools/test-fuxi-wlan-m6i.py
          python3 tools/test-fuxi-wlan-rails.py
          python3 tools/test-fuxi-wlan-w18.py
          python3 tools/test-fuxi-wlan-ath12k.py --sanitize
          python3 tools/test-fuxi-rtc-read.py
          python3 tools/test-fuxi-torch-steady.py --sanitize
  host:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      CC: clang
      PYTHONDONTWRITEBYTECODE: '1'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned inspection dependency
        run: python3 -m pip install capstone==5.0.7
      - name: Prepare pinned public source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/zgl97/ios-fuxi.git
          git -C source fetch --no-tags --depth=1 origin 979e2f08c704677bb75934ae96d4686ba9d1692b
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 979e2f08c704677bb75934ae96d4686ba9d1692b
          for patch in surface-stride bo-slots surfrow-mode2 perf-governor ib-profile perf-wide prof-live prof-inclusive swipe-pacing prof-inclusive-wait prof-edges taps-presets input-fixes taps-page2 ibprof-draws taps-page1 backlight-dsi adsp-battery; do
            git -C source apply --check "../harness/patches/kernel-$patch.patch"
            git -C source apply "../harness/patches/kernel-$patch.patch"
          done
          if test -s harness/patches/hw000-preparation.patch; then
            git -C source apply --check ../harness/patches/hw000-preparation.patch
            git -C source apply ../harness/patches/hw000-preparation.patch
          fi
      - name: Verify bounded production helpers
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test-fuxi-bt-geni-fifo.py --sanitize
          python3 tools/test-fuxi-bt-clock.py --sanitize
          python3 tools/test-fuxi-haptic-fifo.py --cc clang
          python3 tools/test-fuxi-haptic-fifo.py --cc clang --syntax-only
          python3 tools/test-fuxi-haptic-survey.py --cc clang
          python3 tools/test-fuxi-haptic-survey.py --cc clang --syntax-only
          clang -target arm64-apple-darwin -ffreestanding -mgeneral-regs-only -std=c11 -Wall -Wextra -Werror -fsyntax-only -I xnu/fuxi-bluetooth xnu/fuxi-bluetooth/fuxi_bt_geni_fifo.c
          clang -target arm64-apple-darwin -ffreestanding -mgeneral-regs-only -std=c11 -Wall -Wextra -Werror -fsyntax-only -I xnu/fuxi-bt-clock-prep xnu/fuxi-bt-clock-prep/fuxi_bt_clock_ledger.c
          python3 tools/test-fuxi-ram-admission.py
          python3 tools/test-fuxi-ram-sku.py
          python3 tools/test-fuxi-ram-bank.py --synthetic-only --sanitize
          python3 tools/test-fuxi-htc-prep.py --arm64-compiler "$(xcrun --find clang)"
          python3 tools/test-fuxi-wlan-bdf-inventory.py
          python3 tools/test-fuxi-battery-pause.py --sanitize
          python3 tools/test-fuxi-battery-publication.py --sanitize
          python3 tools/test-fuxi-rtc-read.py
          python3 tools/test-fuxi-torch-pulse.py --sanitize
          python3 tools/test-fuxi-torch-steady.py --sanitize
          python3 tools/test-fuxi-torch-audit.py --sanitize
          python3 tools/test-fuxi-wlan-m6i.py
          python3 tools/test-fuxi-wlan-rails.py
          python3 tools/test-fuxi-wlan-w18.py
          python3 tools/test-fuxi-charge-evidence.py
          python3 tools/inspect-fuxi-bluetooth-abi.py --self-test
      - name: Verify default-off gates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sync-fuxi-adsp.py --check
          python3 tools/test-fuxi-bluetooth-xnu.py --sanitize
          CC=clang python3 tools/test-fuxi-haptic-pulse.py
