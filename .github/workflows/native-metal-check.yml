name: Build and test the NativeMetal alternative
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner architecture
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
permissions:
  contents: read
jobs:
  native-metal:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      FUXI_CI_TESTS: full
    steps:
      - name: Check out public test harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Fetch exact public source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/zgl97/ios-fuxi.git
          git -C source fetch --no-tags --depth=1 origin 4b8faded6e76a4730832144fc3cae34c4419fa51
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 4b8faded6e76a4730832144fc3cae34c4419fa51
          git -C source apply --check ../harness/patches/native-patch-stack.patch
          git -C source apply ../harness/patches/native-patch-stack.patch
          git -C source apply --check ../harness/patches/fuxi-copy-span-builder.patch
          git -C source apply ../harness/patches/fuxi-copy-span-builder.patch
          python3 harness/tests/test-native-patch-stack.py source
          git -C source apply --check ../harness/patches/astc-pixel-smoke.patch
          git -C source apply ../harness/patches/astc-pixel-smoke.patch
          git -C source apply --check ../harness/patches/native-smoke-class.patch
          git -C source apply ../harness/patches/native-smoke-class.patch
          git -C source apply --check ../harness/patches/native-ca-smoke-class.patch
          git -C source apply ../harness/patches/native-ca-smoke-class.patch
          cp harness/patches/nativemetal-fuxi-0004-optional-answers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0005-completion-handlers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0006-uchar3-constant.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0007-nocopy-diagnostics.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0008-nocopy-callers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0009-copy-span.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0010-nocopy-provenance.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0011-linear-layout.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0001-copy-span.patch source/tools/patches/
      - name: Build and audit NativeMetal
        shell: bash
        run: |
          set -euo pipefail
          cd source
          xcodebuild -version
          bash tools/ci/build.sh nativemetal
      - name: Upload public-source build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-nativemetal-4b8f
          path: source/tools/out/ci/nativemetal/
          if-no-files-found: warn
          retention-days: 7
