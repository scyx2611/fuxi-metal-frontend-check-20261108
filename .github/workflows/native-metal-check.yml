name: Build and test the NativeMetal alternative
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner architecture
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
permissions:
  contents: read
jobs:
  native-metal:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      FUXI_CI_TESTS: full
    steps:
      - name: Check out public test harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Fetch exact public source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/zgl97/ios-fuxi.git
          git -C source fetch --no-tags --depth=1 origin 4b8faded6e76a4730832144fc3cae34c4419fa51
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 4b8faded6e76a4730832144fc3cae34c4419fa51
          git -C source apply --check ../harness/patches/native-patch-stack.patch
          git -C source apply ../harness/patches/native-patch-stack.patch
          git -C source apply --check ../harness/patches/fuxi-copy-span-builder.patch
          git -C source apply ../harness/patches/fuxi-copy-span-builder.patch
          python3 harness/tests/test-native-patch-stack.py source
          git -C source apply --check ../harness/patches/astc-pixel-smoke.patch
          git -C source apply ../harness/patches/astc-pixel-smoke.patch
          git -C source apply --check ../harness/patches/native-smoke-class.patch
          git -C source apply ../harness/patches/native-smoke-class.patch
          git -C source apply --check ../harness/patches/native-ca-smoke-class.patch
          git -C source apply ../harness/patches/native-ca-smoke-class.patch
          git -C source apply --check ../harness/patches/fuxi-tudebug-bootarg.patch
          git -C source apply ../harness/patches/fuxi-tudebug-bootarg.patch
          git -C source apply --check ../harness/patches/fuxi-bridge-lto-builder.patch
          git -C source apply ../harness/patches/fuxi-bridge-lto-builder.patch
          git -C source apply --check ../harness/patches/fuxi-bridge-lse-builder.patch
          git -C source apply ../harness/patches/fuxi-bridge-lse-builder.patch
          git -C source apply --check ../harness/patches/fuxi-metal-m9-m11-multiclient-120hz.patch
          git -C source apply ../harness/patches/fuxi-metal-m9-m11-multiclient-120hz.patch
          cp harness/patches/nativemetal-fuxi-0004-optional-answers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0005-completion-handlers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0006-uchar3-constant.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0007-nocopy-diagnostics.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0008-nocopy-callers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0009-copy-span.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0010-nocopy-provenance.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0011-linear-layout.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0012-foreign-linear.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0013-swap-wait.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0014-lost-reason.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0015-thread-cache.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0016-split-commits.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0017-frame-diagnostics.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0018-deferred-encoding.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0019-hybrid-turnip.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0020-overlap-commits.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0021-error-names.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0022-pipeline-prewarm.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0023-overlap-handlers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0024-texture-rotation.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0025-held-imports-feature-set-and-last-lost.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0026-tile-pipeline-guard.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0027-surface-tex-cache-and-telemetry.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0028-vectorkit-render-encoder.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0029-maps-library-and-safe-fallback.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0030-maps-canvas-residency-argbuf-telemetry.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0031-msaa-resolve-present-blit-compute-texview.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0032-p1-p3-hotpath-and-turnip-resolve-diag.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0034-lost-race-guard.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0001-copy-span.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0002-fresh-zero.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0004-surface-alias.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0005-family-cache.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0006-keep-draw.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0007-mesa-log-level.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0008-shadow-log.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0009-linear-align.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0010-draw-census.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0011-census-rest.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0012-census-split.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0013-lane-samplers.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0014-lane-sets.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0015-census-calls.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0016-lane-logs.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0017-lane-quiet.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0018-lane-leftovers.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0019-census-passes.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0020-lane-strips.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0021-rotated-two-plane.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0022-fast-rotated-staging.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0023-owned-image-pool.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0024-first-loss-ring.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0025-image-pool-telemetry.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0026-null-pipeline-skip-counter.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0027-view-shadow-iosurface-alias.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0028-turnip-native-color-resolve.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0029-bound-spares-command-pools.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0030-dont-care-preserve-and-diag.patch source/tools/patches/
      - name: Build and audit NativeMetal
        shell: bash
        run: |
          set -euo pipefail
          cd source
          xcodebuild -version
          bash tools/ci/build.sh nativemetal
      - name: Upload public-source build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-nativemetal-4b8f
          path: source/tools/out/ci/nativemetal/
          if-no-files-found: warn
          retention-days: 7
