name: Test NativeMetal host integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host:
    # The existing census forwarding fixture exercises the ARM64 return ABI.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out public test harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Fetch pinned public sources and build host bridge
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/zgl97/ios-fuxi.git
          git -C source fetch --no-tags --depth=1 origin 4b8faded6e76a4730832144fc3cae34c4419fa51
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 4b8faded6e76a4730832144fc3cae34c4419fa51
          git -C source apply --check ../harness/patches/native-patch-stack.patch
          git -C source apply ../harness/patches/native-patch-stack.patch
          git -C source apply --check ../harness/patches/fuxi-copy-span-builder.patch
          git -C source apply ../harness/patches/fuxi-copy-span-builder.patch
          python3 harness/tests/test-native-patch-stack.py source
          git -C source apply --check ../harness/patches/astc-pixel-smoke.patch
          git -C source apply ../harness/patches/astc-pixel-smoke.patch
          cp harness/patches/nativemetal-fuxi-0004-optional-answers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0005-completion-handlers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0006-uchar3-constant.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0007-nocopy-diagnostics.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0008-nocopy-callers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0009-copy-span.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0010-nocopy-provenance.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0011-linear-layout.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0012-foreign-linear.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0013-swap-wait.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0014-lost-reason.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0001-copy-span.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0002-fresh-zero.patch source/tools/patches/
          cd source
          source tools/ci/pins.env
          git init deps/host-mesa
          git -C deps/host-mesa remote add origin https://chromium.googlesource.com/external/gitlab.freedesktop.org/mesa/mesa
          git -C deps/host-mesa fetch --no-tags --depth=1 origin "$MESA_SHA"
          git -C deps/host-mesa checkout --detach FETCH_HEAD
          python3 tools/build-fuxi-nativemetal.py --target host --native deps/host-native --metal2vulkan deps/host-m2v --build deps/host-build --out deps/host-output --headers deps/host-mesa/include
      - name: Run native bridge and frontend tests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cp ../harness/tests/NativePortTests.mm tools/fuxi-metal/NativePortTests.mm
          python3 tools/test-fuxi-metal-frontend.py
          python3 tools/test-fuxi-nativemetal.py --native deps/host-native --metal2vulkan deps/host-m2v --bridge deps/host-output/libnative_metal_bridge.dylib
          xcrun clang++ -std=c++17 -O2 -Wall -Wextra -Werror -I deps/host-native ../harness/tests/FuxiNocopyObservationTests.cpp -o "$RUNNER_TEMP/fuxi-observation-test"
          "$RUNNER_TEMP/fuxi-observation-test"
          xcrun --sdk iphoneos clang++ -std=c++17 -O2 -Wall -Wextra -Werror -target arm64-apple-ios16.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -I deps/host-native -c ../harness/tests/FuxiNocopyObservationTests.cpp -o "$RUNNER_TEMP/fuxi-observation-ios.o"
          xcrun clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -Wno-deprecated-declarations -fobjc-arc -fblocks -fsanitize=address,undefined -I tools/fuxi-metal -DFUXI_NATIVE_FRONTEND=\"$PWD/deps/host-native/NativeBridgeMetalFrontend.mm\" ../harness/tests/FuxiLinearLayoutTests.mm deps/host-output/libnative_metal_bridge.dylib -framework Foundation -framework Metal -framework IOSurface -o "$RUNNER_TEMP/linear-layout-host"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/linear-layout-host"
          source tools/ci/pins.env
          cargo +"$RUST_VERSION" test --manifest-path deps/host-m2v/Cargo.toml -p metal2vulkan-runtime --lib ffi_span_tests
